
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b35">
<title>RPD AFRICA AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#071b35;color:white}
header{background:#102d50;padding:22px;text-align:center}
h1{color:#39d5ff;margin:0}
main{padding:20px;max-width:500px;margin:auto}
.card{background:#12365b;padding:20px;border-radius:15px;margin:18px 0}
.balance{font-size:30px;color:#38e5a1;font-weight:bold}
button{background:#00a9d6;color:white;border:0;padding:14px;border-radius:9px;width:100%;font-size:16px;margin-top:10px}
input{width:100%;padding:13px;border-radius:8px;border:0;margin:8px 0}
small{color:#c7d8e8}
</style>
</head>
<body>
<header>
<h1>RPD AFRICA AI</h1>
<p>Bienvenue sur votre plateforme</p>
</header>
<main>
<div class="card">
<h2>Mon compte</h2>
<p>Solde disponible</p>
<div class="balance">0 FCFA</div>
<small>Solde de démonstration</small>
</div>
<div class="card">
<h2>Créer un compte</h2>
<input type="text" placeholder="Nom complet">
<input type="email" placeholder="Adresse e-mail">
<input type="password" placeholder="Mot de passe">
<button onclick="alert('Inscription de démonstration')">S'inscrire</button>
</div>
<div class="card">
<h2>Mes activités</h2>
<p>Récompenses après validation</p>
<p>Historique des opérations</p>
<button onclick="alert('Fonctionnalité en préparation')">Voir mes activités</button>
</div>
<p style="text-align:center"><small>RPD AFRICA AI © 2026</small></p>
</main>
</body>
</html>
